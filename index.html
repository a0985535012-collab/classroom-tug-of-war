<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>知識拔河｜多人連線</title><style>*{box-sizing:border-box}body{margin:0;background:#101c29;color:#edf4fa;font:18px/1.6 system-ui}main{max-width:1200px;margin:auto;padding:24px}h1{font-size:30px}.panel{background:#1b2b3c;padding:22px;border-radius:16px;margin:18px 0}button,input,select{font:inherit;padding:12px;border:1px solid #698096;border-radius:8px;background:#263d50;color:white;margin:5px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}a{color:#b8f3cd}.arena{position:relative;aspect-ratio:16/9;background:url('assets/field.png') center/100% 100%;border-radius:16px;overflow:hidden}.teamLayer{position:absolute;inset:7% 9% 11%;transition:transform .5s}.teamLayer img{width:100%;height:100%;object-fit:contain}.score{display:flex;justify-content:space-between;font-size:24px;gap:10px}.blue{color:#70caff}.orange{color:#ffbe79}#options{display:grid;gap:10px}#options button{text-align:left}#links input{width:95%;font-size:14px}.freeze{position:fixed;inset:0;background:#020508f5;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column}.freeze strong{font-size:70px}[hidden]{display:none!important}.muted{font-size:14px;color:#afc0d0}#message{white-space:pre-wrap}table{width:100%;font-size:15px;text-align:left}td{padding:5px}#clock{font-size:36px;font-variant-numeric:tabular-nums}.bar{height:12px;background:#ffbe79;border-radius:8px;overflow:hidden;margin:15px 0}.bar div{height:100%;background:#70caff;width:50%}.result{text-align:center;font-size:30px;color:#b8f3cd}body.student #arenaPanel{display:none}body.projector #hostControls,body.projector #lobby,body.projector #rosterPanel{display:none}@media(max-width:600px){main{padding:12px}button,input,select{max-width:100%}.score{font-size:18px}}</style><main><h1>知識拔河｜多人連線</h1><p class="muted" id="roleText"></p><div id="message" role="status" class="panel">正在初始化…</div><section id="createPanel" class="panel" hidden><h2>建立獨立課堂房間</h2><select id="bank"></select><select id="minutes"><option value="10">10分鐘上限</option><option value="5">5分鐘</option><option value="3">3分鐘</option></select><select id="mode"><option value="fair">公平加權（答錯 −2／−0.5）</option><option value="original">原始規則（答錯均 −1）</option></select><button id="create">建立房間</button></section><section id="lobby" class="panel" hidden><h2>加入隊伍</h2><input id="name" maxlength="16" placeholder="座號或暱稱"><select id="team"><option value="A">提報組（5人）</option><option value="B">挑戰組（20人）</option></select><button id="join">加入</button></section><section id="arenaPanel" class="panel" hidden><div class="score"><span class="blue" id="scoreA"></span><span id="clock">10:00</span><span class="orange" id="scoreB"></span></div><div class="arena"><div class="teamLayer" id="people"><img src="assets/tug-people.png" alt="藍橘兩隊人物拔河"></div></div><div class="bar"><div id="bar"></div></div><div id="result" class="result"></div></section><section id="hostControls" class="panel" hidden><div id="links"></div><button id="prep">準備倒數5分鐘</button><span id="prepClock"></span><p class="muted">確認名冊與在線人數後開賽；準備計時僅供教師參考。</p><button id="start">開始</button><button id="pause">暫停</button><button id="resume">繼續</button><button id="end">提前結束並結算</button><button id="export">下載作答紀錄</button><button id="new">建立下一局</button></section><section id="rosterPanel" class="panel" hidden><h2 id="online"></h2><table><tbody id="roster"></tbody></table></section><section id="questionPanel" class="panel" hidden><div id="progress"></div><h2 id="question"></h2><div id="options"></div><p id="feedback"></p><button id="next">取得下一題</button></section><p class="muted">班級題庫相互獨立。遊戲開始後鎖定隊伍，題目與選項隨機排序，每人每題限答一次。答案由伺服器判定。</p></main><div id="freeze" class="freeze" hidden><span>答錯，稍作停頓</span><strong id="freezeCount"></strong></div><script type="module" src="app.js?v=20261128"></script></html>
